# --------------------------------------------------
# Logging
# --------------------------------------------------
logging:
  # Logs startup information and initialization timings.
  startup: false

  # Logs the execution time of sorting operations.
  performance: false

  # Enables verbose debug logging.
  debug: false

# --------------------------------------------------
# Commands
# --------------------------------------------------
commands:
  # Aliases allows you to change the command to specifics shortcuts, if you want to use
  # Towny's /nc (nation chat) command you can change this to another command
  aliases:
    - nc
    # - neat
    # - sort

# --------------------------------------------------
# Sorting
# --------------------------------------------------
sorting:
  double-click: true
  command-sort: true

# --------------------------------------------------
# Weights
# --------------------------------------------------

# Controls how item weights are configured.
# simple   = Adjust category weights only.
# advanced = Adjust both category and individual item weights.
weights:
  mode: simple
