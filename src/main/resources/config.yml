# --------------------------------------------------
# Logging
# --------------------------------------------------
logging:
  # Logs startup information and initialization timings.
  startup: false

  # Logs the execution time of sorting operations.
  performance: false

  # Enables verbose debug logging.
  debug: false

# --------------------------------------------------
# Commands
# --------------------------------------------------
commands:
  # Configure command aliases.
  # Change this if another plugin already uses /nc (e.g. Towny).
  aliases:
    - nc
    # - neat
    # - sort

# --------------------------------------------------
# Sorting
# --------------------------------------------------
sorting:
  # Allows sorting containers by double-clicking an empty slot.
  double-click: true

  # Allows sorting containers using the /neatchests sort command.
  command-sort: true

  # Controls how items are grouped during sorting.
  # This mainly affects forestry-related materials.
  #
  # category   = Groups items by category, such as building blocks and miscellaneous items.
  # family     = Keeps material families together, such as all oak items followed by all spruce items.
  # block-type = Groups matching block types together, such as all logs followed by all planks.
  mode: category

# --------------------------------------------------
# Weights
# --------------------------------------------------

# Controls how item weights are configured.
# simple   = Adjust category weights only.
# advanced = Adjust both category and individual item weights.
weights:
  mode: simple
